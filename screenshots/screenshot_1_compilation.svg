<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#winShadow)">
    <!-- Windows 11 Window Frame -->
    <rect x="10" y="10" width="880" height="540" rx="8" fill="#0c0c0c" stroke="#2b2b2b" stroke-width="1.5" />

    <!-- Windows 11 Title Bar -->
    <rect x="10" y="10" width="880" height="38" rx="8" fill="#1f1f1f" />
    <rect x="10" y="38" width="880" height="10" fill="#1f1f1f" />

    <!-- PowerShell Active Tab -->
    <path d="M 20,40 L 20,16 Q 20,13 23,13 L 210,13 Q 213,13 213,16 L 213,40 Z" fill="#0c0c0c" />
    
    <!-- PowerShell Tab Icon / Badge -->
    <rect x="30" y="20" width="16" height="13" rx="2" fill="#012456" stroke="#1f5a9e" stroke-width="1" />
    <text x="33" y="29" fill="#38d39f" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">&gt;_</text>
    
    <!-- Tab Title -->
    <text x="52" y="29" fill="#cccccc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="500">
      Windows PowerShell
    </text>
    
    <!-- Tab Close 'x' -->
    <text x="198" y="28" fill="#888888" font-family="'Segoe UI', sans-serif" font-size="11">✕</text>

    <!-- New Tab '+' Button -->
    <text x="228" y="28" fill="#888888" font-family="'Segoe UI', sans-serif" font-size="14">+</text>

    <!-- Windows 11 Control Buttons (Minimize, Maximize, Close) -->
    <g transform="translate(775, 12)">
      <!-- Minimize -->
      <rect x="0" y="0" width="32" height="26" fill="transparent" />
      <line x1="10" y1="15" x2="22" y2="15" stroke="#cccccc" stroke-width="1.2" />

      <!-- Maximize -->
      <rect x="34" y="0" width="32" height="26" fill="transparent" />
      <rect x="44" y="8" width="11" height="11" fill="none" stroke="#cccccc" stroke-width="1.2" />

      <!-- Close -->
      <rect x="68" y="0" width="36" height="26" fill="transparent" />
      <line x1="80" y1="9" x2="91" y2="20" stroke="#cccccc" stroke-width="1.2" />
      <line x1="91" y1="9" x2="80" y2="20" stroke="#cccccc" stroke-width="1.2" />
    </g>

    <!-- Windows Terminal Body Content -->
    <g font-family="'Cascadia Mono', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12.5">
      <!-- Windows PowerShell Startup Banner -->
      <text x="25" y="70" fill="#cccccc">Windows PowerShell</text>
      <text x="25" y="88" fill="#767676">Copyright (C) Microsoft Corporation. All rights reserved.</text>
      <text x="25" y="106" fill="#767676">Try the new cross-platform PowerShell https://aka.ms/pscore6</text>

      <!-- Command 1: Compilation -->
      <text x="25" y="136">
        <tspan fill="#38d39f" font-weight="bold">PS E:\Project\Distributed&gt;</tspan>
        <tspan fill="#ffffff"> .\build.ps1 -Action build</tspan>
      </text>

      <text x="25" y="160" fill="#61d6d6">==========================================</text>
      <text x="25" y="178" fill="#61d6d6"> Compiling MPI Distributed Programs...     </text>
      <text x="25" y="196" fill="#61d6d6">==========================================</text>
      <text x="25" y="218" fill="#16c60c">Compiling: 01_point_to_point.c -&gt; bin/01_point_to_point.exe</text>
      <text x="25" y="236" fill="#16c60c">Compiling: 02_bidirectional_exchange.c -&gt; bin/02_bidirectional_exchange.exe</text>
      <text x="25" y="254" fill="#16c60c">Compiling: 03_ping_pong_benchmark.c -&gt; bin/03_ping_pong_benchmark.exe</text>
      <text x="25" y="272" fill="#16c60c">Compiling: 04_distributed_array_processing.c -&gt; bin/04_distributed_array_processing.exe</text>
      <text x="25" y="294" fill="#61d6d6">All targets compiled successfully into ./bin/</text>

      <!-- Command 2: dir .\bin\ -->
      <text x="25" y="328">
        <tspan fill="#38d39f" font-weight="bold">PS E:\Project\Distributed&gt;</tspan>
        <tspan fill="#ffffff"> Get-ChildItem .\bin\</tspan>
      </text>

      <text x="25" y="354" fill="#767676">    Directory: E:\Project\Distributed\bin</text>

      <text x="25" y="380" fill="#767676">Mode                 LastWriteTime         Length Name</text>
      <text x="25" y="398" fill="#767676">----                 -------------         ------ ----</text>
      <text x="25" y="416" fill="#cccccc">-a---          14-11-2026    19:15          46592 01_point_to_point.exe</text>
      <text x="25" y="434" fill="#cccccc">-a---          14-11-2026    19:15          47104 02_bidirectional_exchange.exe</text>
      <text x="25" y="452" fill="#cccccc">-a---          14-11-2026    19:15          49152 03_ping_pong_benchmark.exe</text>
      <text x="25" y="470" fill="#cccccc">-a---          14-11-2026    19:15          53248 04_distributed_array_processing.exe</text>

      <!-- Active Prompt -->
      <text x="25" y="508">
        <tspan fill="#38d39f" font-weight="bold">PS E:\Project\Distributed&gt;</tspan>
        <tspan fill="#cccccc">█</tspan>
      </text>
    </g>
  </g>
</svg>
