<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#winShadow)">
    <!-- Windows 11 Window Frame -->
    <rect x="10" y="10" width="880" height="660" rx="8" fill="#0c0c0c" stroke="#2b2b2b" stroke-width="1.5" />

    <!-- Windows 11 Title Bar -->
    <rect x="10" y="10" width="880" height="38" rx="8" fill="#1f1f1f" />
    <rect x="10" y="38" width="880" height="10" fill="#1f1f1f" />

    <!-- PowerShell Active Tab -->
    <path d="M 20,40 L 20,16 Q 20,13 23,13 L 210,13 Q 213,13 213,16 L 213,40 Z" fill="#0c0c0c" />
    
    <!-- PowerShell Tab Icon / Badge -->
    <rect x="30" y="20" width="16" height="13" rx="2" fill="#012456" stroke="#1f5a9e" stroke-width="1" />
    <text x="33" y="29" fill="#38d39f" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">&gt;_</text>
    
    <!-- Tab Title -->
    <text x="52" y="29" fill="#cccccc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="500">
      Windows PowerShell
    </text>
    <text x="198" y="28" fill="#888888" font-family="'Segoe UI', sans-serif" font-size="11">✕</text>
    <text x="228" y="28" fill="#888888" font-family="'Segoe UI', sans-serif" font-size="14">+</text>

    <!-- Windows 11 Controls -->
    <g transform="translate(775, 12)">
      <line x1="10" y1="15" x2="22" y2="15" stroke="#cccccc" stroke-width="1.2" />
      <rect x="44" y="8" width="11" height="11" fill="none" stroke="#cccccc" stroke-width="1.2" />
      <line x1="80" y1="9" x2="91" y2="20" stroke="#cccccc" stroke-width="1.2" />
      <line x1="91" y1="9" x2="80" y2="20" stroke="#cccccc" stroke-width="1.2" />
    </g>

    <!-- Terminal Content Area -->
    <g font-family="'Cascadia Mono', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12">
      <!-- Command Prompt -->
      <text x="25" y="70">
        <tspan fill="#38d39f" font-weight="bold">PS E:\Project\Distributed&gt;</tspan>
        <tspan fill="#ffffff"> mpiexec -n 2 .\bin\01_point_to_point.exe</tspan>
      </text>

      <!-- System 1 Output -->
      <text x="25" y="98" fill="#64748b">======================================================================</text>
      <text x="25" y="117" fill="#61d6d6" font-weight="bold">[SYSTEM 1] Hostname: LAPTOP-WIN11 | Rank: 0</text>
      <text x="25" y="136" fill="#61d6d6">[SYSTEM 1] Role: SENDER</text>
      <text x="25" y="155" fill="#64748b">======================================================================</text>
      <text x="25" y="174" fill="#cccccc">[SYSTEM 1] Initializing data array:</text>
      <text x="25" y="193" fill="#cccccc">   data[0] =  25.40</text>
      <text x="25" y="212" fill="#cccccc">   data[1] =  29.15</text>
      <text x="25" y="231" fill="#cccccc">   data[2] =  32.90</text>
      <text x="25" y="250" fill="#cccccc">   data[3] =  36.65</text>
      <text x="25" y="269" fill="#cccccc">   data[4] =  40.40</text>
      <text x="25" y="288" fill="#cccccc">   data[5] =  44.15</text>
      <text x="25" y="307" fill="#cccccc">   data[6] =  47.90</text>
      <text x="25" y="326" fill="#cccccc">   data[7] =  51.65</text>

      <text x="25" y="352" fill="#61d6d6">[SYSTEM 1] Sending 8 doubles to System 2...</text>
      <text x="25" y="371" fill="#16c60c" font-weight="bold">[SYSTEM 1] Transmission complete.</text>
      <text x="25" y="390" fill="#64748b">======================================================================</text>

      <!-- System 2 Output -->
      <text x="25" y="418" fill="#64748b">======================================================================</text>
      <text x="25" y="437" fill="#c084fc" font-weight="bold">[SYSTEM 2] Hostname: DESKTOP-WIN11 | Rank: 1</text>
      <text x="25" y="456" fill="#c084fc">[SYSTEM 2] Role: RECEIVER</text>
      <text x="25" y="475" fill="#64748b">======================================================================</text>
      <text x="25" y="494" fill="#cccccc">[SYSTEM 2] Received 8 elements from Source Rank 0 (Tag: 101)</text>
      <text x="25" y="513" fill="#cccccc">[SYSTEM 2] Verifying received values:</text>
      <text x="25" y="532" fill="#cccccc">   received_data[0] =  25.40    received_data[1] =  29.15</text>
      <text x="25" y="551" fill="#cccccc">   received_data[2] =  32.90    received_data[3] =  36.65</text>
      <text x="25" y="570" fill="#cccccc">   received_data[4] =  40.40    received_data[5] =  44.15</text>
      <text x="25" y="589" fill="#cccccc">   received_data[6] =  47.90    received_data[7] =  51.65</text>
      <text x="25" y="612" fill="#16c60c" font-weight="bold">[SYSTEM 2] Data processing complete. Average =  38.53</text>
      <text x="25" y="631" fill="#64748b">======================================================================</text>
    </g>
  </g>
</svg>
