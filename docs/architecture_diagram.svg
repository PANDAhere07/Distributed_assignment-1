<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="sys1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sys2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowLeft" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#0b0f19" rx="12" />

  <!-- Title Header -->
  <text x="480" y="42" fill="#f8fafc" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">
    DISTRIBUTED SYSTEM ARCHITECTURE: 2-NODE MPI CLUSTER
  </text>
  <text x="480" y="66" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Independent Memory Spaces &amp; Dual-CPU Parallel Message Passing Model
  </text>

  <!-- SYSTEM 1 CARD -->
  <g transform="translate(60, 95)" filter="url(#shadow)">
    <rect width="360" height="340" rx="12" fill="url(#sys1Grad)" stroke="#38bdf8" stroke-width="2" />
    <rect width="360" height="42" rx="12" fill="#0284c7" />
    <rect y="30" width="360" height="12" fill="#0284c7" />
    <text x="180" y="27" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">
      SYSTEM 1 (Host: node1-sys1)
    </text>

    <!-- Node specs -->
    <rect x="25" y="60" width="310" height="60" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="40" y="85" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold">Hardware: Single CPU Core (Processor 1)</text>
    <text x="40" y="105" fill="#94a3b8" font-size="12" font-family="monospace">IP: 192.168.1.101 | Architecture: x86_64</text>

    <!-- Isolated Memory -->
    <rect x="25" y="135" width="310" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="40" y="160" fill="#f59e0b" font-size="13" font-family="sans-serif" font-weight="bold">Private Memory Space (RAM 1)</text>
    <text x="40" y="180" fill="#94a3b8" font-size="12" font-family="sans-serif">No Shared Memory with System 2</text>

    <!-- MPI Runtime Box -->
    <rect x="25" y="215" width="310" height="100" rx="8" fill="#0f172a" stroke="#0284c7" stroke-dasharray="4" />
    <text x="40" y="240" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold">MPI Process Environment</text>
    <text x="40" y="262" fill="#e2e8f0" font-size="12" font-family="monospace">• MPI Rank      : 0 (MASTER)</text>
    <text x="40" y="282" fill="#e2e8f0" font-size="12" font-family="monospace">• Communicator  : MPI_COMM_WORLD</text>
    <text x="40" y="302" fill="#e2e8f0" font-size="12" font-family="monospace">• Send/Recv Buf : Local Heap/Stack</text>
  </g>

  <!-- SYSTEM 2 CARD -->
  <g transform="translate(540, 95)" filter="url(#shadow)">
    <rect width="360" height="340" rx="12" fill="url(#sys2Grad)" stroke="#a855f7" stroke-width="2" />
    <rect width="360" height="42" rx="12" fill="#7e22ce" />
    <rect y="30" width="360" height="12" fill="#7e22ce" />
    <text x="180" y="27" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">
      SYSTEM 2 (Host: node2-sys2)
    </text>

    <!-- Node specs -->
    <rect x="25" y="60" width="310" height="60" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="40" y="85" fill="#c084fc" font-size="13" font-family="sans-serif" font-weight="bold">Hardware: Single CPU Core (Processor 2)</text>
    <text x="40" y="105" fill="#94a3b8" font-size="12" font-family="monospace">IP: 192.168.1.102 | Architecture: x86_64</text>

    <!-- Isolated Memory -->
    <rect x="25" y="135" width="310" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="40" y="160" fill="#f59e0b" font-size="13" font-family="sans-serif" font-weight="bold">Private Memory Space (RAM 2)</text>
    <text x="40" y="180" fill="#94a3b8" font-size="12" font-family="sans-serif">No Shared Memory with System 1</text>

    <!-- MPI Runtime Box -->
    <rect x="25" y="215" width="310" height="100" rx="8" fill="#0f172a" stroke="#7e22ce" stroke-dasharray="4" />
    <text x="40" y="240" fill="#c084fc" font-size="13" font-family="sans-serif" font-weight="bold">MPI Process Environment</text>
    <text x="40" y="262" fill="#e2e8f0" font-size="12" font-family="monospace">• MPI Rank      : 1 (WORKER)</text>
    <text x="40" y="282" fill="#e2e8f0" font-size="12" font-family="monospace">• Communicator  : MPI_COMM_WORLD</text>
    <text x="40" y="302" fill="#e2e8f0" font-size="12" font-family="monospace">• Send/Recv Buf : Local Heap/Stack</text>
  </g>

  <!-- INTERCONNECT / NETWORK CHANNEL -->
  <g transform="translate(420, 230)">
    <!-- Data Stream System 1 -> System 2 -->
    <path d="M 0,20 L 120,20" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowRight)" />
    <text x="60" y="12" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">MPI_Send / Scatter</text>

    <!-- Network Hub / Switch Box -->
    <rect x="20" y="35" width="80" height="40" rx="6" fill="#1e293b" stroke="url(#netGrad)" stroke-width="2" />
    <text x="60" y="52" fill="#f8fafc" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">TCP/IP LAN</text>
    <text x="60" y="66" fill="#94a3b8" font-size="8" font-family="sans-serif" text-anchor="middle">Gigabit Ethernet</text>

    <!-- Data Stream System 2 -> System 1 -->
    <path d="M 120,90 L 0,90" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowLeft)" />
    <text x="60" y="108" fill="#f43f5e" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">MPI_Recv / Reduce</text>
  </g>

  <!-- Footer / Protocol info -->
  <rect x="60" y="455" width="840" height="42" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="480" y="480" fill="#94a3b8" font-size="12" font-family="sans-serif" text-anchor="middle">
    Protocol: <tspan fill="#38bdf8" font-weight="bold">MPICH / OpenMPI / MS-MPI</tspan> over TCP Sockets | Model: <tspan fill="#22c55e" font-weight="bold">Explicit Distributed Memory Passing</tspan> | Synchronization: <tspan fill="#eab308" font-weight="bold">MPI_Barrier</tspan>
  </text>
</svg>
